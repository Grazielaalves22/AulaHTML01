<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag-Forms</title>
</head>
<body>
    <h2>Cadastro de alunos</h2>

    <form action="#">

        <label for="campo_nome">Nome:</label>
        <input type="text" name="nome_usuario" id="campo_nome">
        
        <br><br>
        <label for="Email">E-mail:</label>
        <input type="email" name="Contato Email" id="Email" placeholder="Ex:74744-110">
        
        <br><br>
        <label for="Idade">Idade:</label>
        <input type="number" name="Anos" id="Idade">

        <br><br>
        <label for="Residencial">CEP:</label>
        <input type="number" name="Casa_Ap_Comercial" id="Residencial">

        <br><br>
        <label for="Contato">Contato:</label>
        <input type="number" name="telefone" id="Contato">

        <br><br>
        <label for="Acesso">Senha:</label>
        <input type="password" name="Senha" id="Acesso">

        <br><br>
    <input type="submit" value="Enviar">
    </form>

</body>
</html>
